<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SaludYA</title>

<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
    <h1>SaludYA</h1>
</header>

<div class="container">

    <div class="card">

        <h2>Iniciar Sesión</h2>

        <form>

            <label>Correo</label>
            <br><br>

            <input type="email" placeholder="correo@ejemplo.com">

            <br><br>

            <label>Contraseña</label>

            <br><br>

            <input type="password" placeholder="********">

            <br><br>

            <button class="btn">
                Ingresar
            </button>

        </form>

    </div>

</div>

</body>
</html>
